name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: trades
      DB_PASSWORD: trades
      DB_NAME: trades
      TEST_DB_NAME: trades_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE trades LOGIN PASSWORD 'trades';"
          sudo -u postgres createdb -O trades trades
          sudo -u postgres createdb -O trades trades_test
      - run: python -m pip install -r requirements.lock -e '.[test]'
      - run: alembic upgrade head
      - run: pytest -q
